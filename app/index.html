<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Personal Performance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }
        .task-item {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .task-item label {
            margin-left: 10px;
            font-size: 16px;
            color: #555;
            cursor: pointer;
        }
        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .btn-salvar {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-salvar:hover {
            background-color: #0056b3;
        }
        .btn-salvar:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .success {
            color: #28a745;
        }
        .error {
            color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="login-screen" class="text-center">
        <h2>Daily Performance</h2>
        <p class="text-muted mb-4">Para acessar suas tarefas diárias, faça login com sua conta Google.</p>
        <button onclick="loginGoogle()" type="button" class="btn btn-outline-dark btn-lg w-100" style="border-radius: 50px;">
            <i class="bi bi-google text-danger me-2"></i> Entrar com Google
        </button>
    </div>

    <div id="app-screen" style="display: none;">
        <h2>Daily Tasks</h2>
        <form id="tasksForm">
            <input type="hidden" id="auth_code" value="">
            
            <ul class="task-list">
                <li class="task-item">
                    <input type="checkbox" id="udemy" name="30min_udemy">
                    <label for="udemy">30min de Udemy</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="ingles" name="30min_ingles">
                    <label for="ingles">30min de Inglês</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="violao" name="30min_violao">
                    <label for="violao">30min de Violão</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="violino" name="30min_violino">
                    <label for="violino">30min de Violino</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="livro" name="5_paginas_livro">
                    <label for="livro">5 páginas de um livro</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" id="gitpush" name="1_git_push">
                    <label for="gitpush">1 git push diário</label>
                </li>
            </ul>
            <button type="submit" class="btn-salvar" id="btnSalvar">Salvar</button>
            <div id="statusMessage" class="message"></div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'https://3nifp96vv6.execute-api.us-east-1.amazonaws.com/production/perfomance';

    // Configurações do Cognito (Ajustado o COGNITO_DOMAIN sem o https:// no início)
    const COGNITO_CLIENT_ID = "5qb8pffc16v5jp1nrl6oa0g7dr";
    const COGNITO_DOMAIN    = "daily-personal-perfomance-auth.auth.us-east-1.amazoncognito.com";
    const REDIRECT_URI      = "https://daily-personal-perfomance.filipe-deabreu.com";

    function getBrazilDate() {
        const d = new Date();
        const formatter = new Intl.DateTimeFormat('pt-BR', {
            timeZone: 'America/Sao_Paulo',
            year    : 'numeric',
            month   : '2-digit',
            day     : '2-digit'
        });
        const parts = formatter.formatToParts(d);
        const day   = parts.find(p => p.type === 'day').value;
        const month = parts.find(p => p.type === 'month').value;
        const year  = parts.find(p => p.type === 'year').value;
        return `${year}-${month}-${day}`;
    }

    function loginGoogle() {
        const url = `https://${COGNITO_DOMAIN}/oauth2/authorize?client_id=${COGNITO_CLIENT_ID}&response_type=token&scope=email+openid+profile&redirect_uri=${REDIRECT_URI}&identity_provider=Google`;
        window.location.href = url;
    }

// Ciclo de inicialização e verificação de autenticação
    window.addEventListener('DOMContentLoaded', async () => {
        // MUDANÇA AQUI: Lê o hash (#) da URL em vez da interrogação (?)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const token = hashParams.get('id_token');

        if (token) {
            // 1. Usuário autenticado: Alterna as telas
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            
            // Salva o token no input escondido para usar no botão Salvar
            document.getElementById('auth_code').value = token;

            // 2. Limpa a URL para esconder o token gigante
            window.history.replaceState({}, document.title, window.location.pathname);

            // 3. Busca os dados na API passando o Token de autenticação
            const today = getBrazilDate();
            try {
                const response = await fetch(`${API_URL}?data=${today}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}` 
                    }
                });
                
                if (response.ok) {
                    const item = await response.json();
                    if (item && Object.keys(item).length > 0) {
                        if (item['30min_udemy']     === 'yes') document.getElementById('udemy').checked   = true;
                        if (item['30min_ingles']    === 'yes') document.getElementById('ingles').checked  = true;
                        if (item['30min_violao']    === 'yes') document.getElementById('violao').checked  = true;
                        if (item['30min_violino']   === 'yes') document.getElementById('violino').checked = true;
                        if (item['5_paginas_livro'] === 'yes') document.getElementById('livro').checked   = true;
                        if (item['1_git_push']      === 'yes') document.getElementById('gitpush').checked = true;
                    }
                }
            } catch (error) {
                console.error('Erro ao carregar os dados de hoje:', error);
            }
        } else {
            // Se não há token, mostra a tela de login
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('app-screen').style.display   = 'none';
        }
    });

    // Envio do formulário protegido
    document.getElementById('tasksForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const btnSalvar     = document.getElementById('btnSalvar');
        const statusMessage = document.getElementById('statusMessage');
        const code          = document.getElementById('auth_code').value;
        const today         = getBrazilDate();

        const payload = {
            data: today,
            "30min_udemy"    : document.getElementById('udemy').checked ? "yes" : "no",
            "30min_ingles"   : document.getElementById('ingles').checked ? "yes" : "no",
            "30min_violao"   : document.getElementById('violao').checked ? "yes" : "no",
            "30min_violino"  : document.getElementById('violino').checked ? "yes" : "no",
            "5_paginas_livro": document.getElementById('livro').checked ? "yes" : "no",
            "1_git_push"     : document.getElementById('gitpush').checked ? "yes" : "no"
        };

        btnSalvar.disabled = true;
        btnSalvar.innerText = 'Salvando...';
        statusMessage.innerText = '';
        statusMessage.className = 'message';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    // Envia o token para proteger o método POST 
                    'Authorization': `Bearer ${code}`
                },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                statusMessage.innerText = 'Tarefas salvas com sucesso!';
                statusMessage.classList.add('success');
            } else {
                const errData = await response.text();
                statusMessage.innerText = 'Erro ao salvar. Sem autorização ou falha na API.';
                statusMessage.classList.add('error');
                console.error('Erro na API:', errData);
            }
        } catch (error) {
            statusMessage.innerText = 'Erro de rede. Tente novamente.';
            statusMessage.classList.add('error');
            console.error('Erro de requisição:', error);
        } finally {
            btnSalvar.disabled = false;
            btnSalvar.innerText = 'Salvar';
        }
    });
</script>

</body>
</html>
